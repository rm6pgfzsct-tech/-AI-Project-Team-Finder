<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f5ff;
}

.container{
    width:90%;
    max-width:400px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#0066ff;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}

p{
    text-align:center;
}
</style>

</head>

<body>

<div class="container">

<h1>Student Login</h1>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p>Don't have an account? Register</p>

</div>

<script>
function login(){
    alert("Student Login Successful");
}
</script>

</body>
</html>
